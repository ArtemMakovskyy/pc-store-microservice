server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
#    register-with-eureka: false
#    fetch-registry: true

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: java-mail-sender-service
          uri: lb://JAVA-MAIL-SENDER-SERVICE
          predicates:
            - Path=/api/mail/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
