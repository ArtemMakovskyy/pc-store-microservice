<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Keyboard</title>
</head>
<body>
<h1>Update Keyboard</h1>

<!-- Поле для ввода ID клавиатуры -->
<label for="keyboardId">Keyboard ID:</label>
<input type="number" id="keyboardId" min="1" step="1" required>
<button onclick="loadKeyboard()">Load Keyboard</button>
<br>
<!-- Форма для изменения данных клавиатуры -->
<form id="keyboardForm" style="display: none;">
    <label for="partNumber">Part Number:</label>
    <input type="text" id="partNumber" required><br>

    <label for="name">Name:</label>
    <input type="text" id="name" required><br>

    <label for="description">Description:</label>
    <textarea id="description" maxlength="255"></textarea><br>

    <label for="costPrice">Cost Price:</label>
    <input type="number" id="costPrice" min="0.01" step="0.01" required><br>

    <label for="sellingPrice">Selling Price:</label>
    <input type="number" id="sellingPrice" min="0.01" step="0.01" required><br>

    <button type="button" onclick="submitUpdatedKeyboard()">Submit Changes</button>
</form>

<script src="../../../scripts/product/keyboard-management/update-keyboard.js" defer></script>

</body>
</html>
