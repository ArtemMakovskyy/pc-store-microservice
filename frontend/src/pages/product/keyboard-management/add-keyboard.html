<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Keyboard</title>
</head>
<body>
<h1>Add New Keyboard</h1>
<form id="keyboardForm">
    <label for="partNumber">Part Number:</label>
    <input type="text" id="partNumber" required><br>
    <label for="name">Name:</label>
    <input type="text" id="name" required><br>
    <label for="description">Description:</label>
    <textarea id="description" maxlength="255"></textarea><br>
    <label for="costPrice">Cost Price:</label>
    <input type="number" id="costPrice" min="0.01" step="0.01" required><br>
    <label for="sellingPrice">Selling Price:</label>
    <input type="number" id="sellingPrice" min="0.01" step="0.01" required><br>
    <button type="button" onclick="submitKeyboard()">Submit</button>
</form>

<script src="../../../scripts/product/keyboard-management/add-keyboard.js" defer></script>

</body>
</html>
