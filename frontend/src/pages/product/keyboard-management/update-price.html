<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Selling Price</title>
</head>
<body>
<h1>Update Selling Price</h1>

<!-- Поле для ввода ID клавиатуры -->
<label for="keyboardId">Keyboard ID:</label>
<input type="number" id="keyboardId" required><br>

<!-- Поле для ввода новой цены -->
<label for="newSellingPrice">New Selling Price:</label>
<input type="number" id="newSellingPrice" min="0.01" step="0.01" required><br>

<button onclick="updateSellingPrice()">Update Price</button>

<script src="../../../scripts/product/keyboard-management/update-price.js" defer></script>

</body>
</html>
