version: '3'

services:

  mysql-parse:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: rootPassword
      MYSQL_DATABASE: parser
      MYSQL_USER: bestuser
      MYSQL_PASSWORD: secretPassword
    ports:
      - "3307:3306"
    restart: unless-stopped
    networks:
      - parser-net

  postgres-stock:
    image: postgres:latest
    environment:
      POSTGRES_DB: stock
      POSTGRES_USER: bestuser
      POSTGRES_PASSWORD: secretPassword
    ports:
      - "5431:5432"
    restart: unless-stopped
    networks:
      - parser-net

  postgres-product:
    image: postgres:latest
    environment:
      POSTGRES_DB: product
      POSTGRES_USER: bestuser
      POSTGRES_PASSWORD: secretPassword
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - parser-net

networks:
  parser-net:
    driver: bridge
